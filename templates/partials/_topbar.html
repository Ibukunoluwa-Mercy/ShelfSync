<header class="topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn sidebar-toggle d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#appSidebar" aria-controls="appSidebar" aria-label="Open navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
    <h1 class="page-title mb-0">{{ page_title|default('ShelfSync') }}</h1>
  </div>
  <div class="d-flex align-items-center gap-3">
    <a href="#" class="user-link"><i class="fa-solid fa-user me-1"></i> {{ session.get('full_name', 'User') }}</a>
    <form method="post" action="{{ url_for('logout') }}" class="d-inline mb-0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-outline-primary btn-sm">
        <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
      </button>
    </form>
  </div>
</header>
