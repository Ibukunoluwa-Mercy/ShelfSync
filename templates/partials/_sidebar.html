<aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="appSidebar" aria-labelledby="sidebarLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="sidebarLabel">ShelfSync</h5>
    <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="sidebar-inner">
    <img src="{{ url_for('static', filename='images/ShelfSync Sync Logo.png') }}" alt="ShelfSync logo" class="brand-logo sidebar-logo">
    <nav class="sidebar-nav" aria-label="Application navigation">
      <a href="#" class="{% if request.endpoint == 'dashboard' %}active{% endif %}"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="#" class="{% if request.endpoint == 'products' %}active{% endif %}"><i class="fa-solid fa-box"></i> Products</a>
      <a href="#" class="{% if request.endpoint == 'stock_management' %}active{% endif %}"><i class="fa-solid fa-warehouse"></i> Stock Management</a>
      <a href="#" class="{% if request.endpoint == 'sales' %}active{% endif %}"><i class="fa-solid fa-cart-shopping"></i> Sales</a>
      {% if session.get('role') == 'admin' %}
        <a href="#" class="{% if request.endpoint == 'reports' %}active{% endif %}"><i class="fa-solid fa-chart-line"></i> Reports</a>
        <a href="#" class="{% if request.endpoint == 'categories' %}active{% endif %}"><i class="fa-solid fa-tags"></i> Categories</a>
        <a href="#" class="{% if request.endpoint == 'users' %}active{% endif %}"><i class="fa-solid fa-users"></i> Users</a>
      {% endif %}
      <a href="#" class="{% if request.endpoint == 'low_stock_alerts' %}active{% endif %}"><i class="fa-solid fa-triangle-exclamation"></i> Low Stock Alerts</a>
      {% if session.get('role') == 'admin' %}
        <a href="#" class="{% if request.endpoint == 'settings' %}active{% endif %}"><i class="fa-solid fa-gear"></i> Settings</a>
      {% endif %}
    </nav>
  </div>
</aside>
