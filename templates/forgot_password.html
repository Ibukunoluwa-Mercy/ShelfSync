{% extends "base_public.html" %}

{% block title %}Forgot Password | {{ shop_name }}{% endblock %}

{% block content %}
<main class="container py-5 text-center" style="max-width: 520px;">
  <div class="card p-4 shadow-sm">
    <div class="mb-3 text-warning">
      <i class="fa-solid fa-key fa-3x"></i>
    </div>
    <h1 class="h4 text-success mb-2">Password Recovery</h1>
    <p class="text-muted">Password recovery coming soon.</p>
    <div class="mt-3">
      <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
      </a>
    </div>
  </div>
</main>
{% endblock %}
